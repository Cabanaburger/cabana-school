<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qualidade & Segurança Alimentar | Universidade Cabana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --green:#53a246;
  --green-dark:#3c7d34;
  --green-light:#deedd5;
  --teal:#08a3c1;
  --jade:#1fb584;
  --purple:#993198;
  --orange:#e69930;
  --coral:#e86943;
  --yellow:#fab514;
  --magenta:#ec2a90;
  --brown:#3c7d34;
  --brown-dark:#16281a;
  --cream:#fdf5d0;
  --cream-deep:#fbecb8;
  --orange-dark:#c9762a;
  --red:#c0392b;
  --ink:#241f1a;
  --ink-soft:#63594a;
  --white:#ffffff;
  --shadow: 0 10px 30px rgba(20,30,15,0.12);
  --shadow-sm: 0 4px 14px rgba(20,30,15,0.09);
  --radius: 20px;
  --radius-sm: 12px;
  --font-display:'Bevan', Georgia, serif;
  --font-body:'Work Sans', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--cream);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}

/* ---------- Layout shell ---------- */
#app{display:flex;min-height:100vh;}

.sidebar{
  width:280px;flex-shrink:0;
  background:linear-gradient(180deg, var(--brown-dark), #0a1410 85%);
  color:#f4ead9;
  padding:28px 20px 24px;
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
}
.sidebar-logo{
  display:flex;align-items:center;gap:10px;margin-bottom:6px;
}
.sidebar-logo .mark{
  width:44px;height:44px;border-radius:50%;background:#fff;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  border:2px solid var(--green-light);flex-shrink:0;
}
.sidebar-logo .mark img{width:100%;height:100%;object-fit:cover;transform:scale(1.35) translateY(4px);}
.sidebar-logo .txt{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.15;color:#f4ead9;}
.sidebar-logo .txt span{display:block;font-size:11px;font-weight:600;color:#c9b79e;letter-spacing:.04em;}

.sidebar-title{font-family:var(--font-display);font-size:20px;font-weight:700;margin:18px 0 4px;color:#fff;}
.sidebar-sub{font-size:12.5px;color:#c9b79e;margin-bottom:18px;line-height:1.4;}

.progress-overview{background:rgba(255,255,255,0.06);border-radius:var(--radius-sm);padding:14px;margin-bottom:20px;}
.progress-overview .pct{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--green-light);}
.progress-overview .bar{height:8px;border-radius:6px;background:rgba(255,255,255,0.12);overflow:hidden;margin-top:8px;}
.progress-overview .bar > div{height:100%;background:linear-gradient(90deg,var(--green),#6fc06f);border-radius:6px;transition:width .4s ease;}
.progress-overview .lbl{font-size:11.5px;color:#c9b79e;margin-top:6px;}

.nav-modules{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;gap:6px;}
.nav-module{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  cursor:pointer;transition:background .15s ease;
  border:1px solid transparent;
}
.nav-module:hover{background:rgba(255,255,255,0.06);}
.nav-module.active{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.14);}
.nav-module .num{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:12px;font-weight:700;
  background:rgba(255,255,255,0.1);color:#e8dcc8;
}
.nav-module.done .num{background:var(--green);color:#fff;}
.nav-module.done .num::before{content:"✓";}
.nav-module .label{font-size:13.5px;font-weight:700;color:#f0e6d6;line-height:1.25;}
.nav-module .sub{font-size:11px;color:#b8a68c;font-weight:600;}

.sidebar-footer{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1);font-size:11px;color:#a8987e;line-height:1.5;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;padding:0 24px 80px;}
.topbar{
  width:100%;max-width:820px;padding:22px 0 8px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.topbar .crumb{font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}
.topbar .crumb b{color:var(--green-dark);}
.mobile-menu-btn{display:none;}

.content{width:100%;max-width:820px;}

/* ---------- Cards / building blocks ---------- */
.module-hero{
  background:linear-gradient(135deg, var(--green), var(--green-dark));
  border-radius:var(--radius);color:#fff;padding:34px 32px;margin-bottom:26px;
  position:relative;overflow:hidden;box-shadow:var(--shadow);
}
.module-hero::after{
  content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;
  border-radius:50%;background:rgba(255,255,255,0.08);
}
.module-hero .eyebrow{font-size:12.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#d9f2d4;}
.module-hero h1{font-family:var(--font-display);font-size:30px;margin:6px 0 10px;line-height:1.15;}
.module-hero p{font-size:15px;line-height:1.55;max-width:560px;color:#eefbe9;margin:0;}

.lesson-card{
  background:var(--white);border-radius:var(--radius);padding:26px 28px;
  margin-bottom:18px;box-shadow:var(--shadow-sm);border:1px solid #f0e8d8;
}
.lesson-card h2{font-family:var(--font-display);font-size:21px;color:var(--brown-dark);margin:0 0 12px;display:flex;align-items:center;gap:10px;}
.lesson-card h2 .tag{
  font-family:var(--font-body);font-size:11px;font-weight:800;background:var(--green-light);
  color:var(--green-dark);padding:3px 9px;border-radius:20px;letter-spacing:.03em;text-transform:uppercase;
}
.lesson-card h3{font-family:var(--font-display);font-size:16.5px;color:var(--brown-dark);margin:18px 0 8px;}
.icon-inline{width:20px;height:20px;vertical-align:-5px;margin-right:7px;}
.lesson-card p{font-size:15px;line-height:1.65;color:#42392f;margin:0 0 12px;}
.lesson-card ul, .lesson-card ol{margin:0 0 12px;padding-left:22px;}
.lesson-card li{font-size:15px;line-height:1.6;color:#42392f;margin-bottom:6px;}
.lesson-card img.inline-img{border-radius:14px;margin:14px 0;box-shadow:var(--shadow-sm);}
.lesson-card .caption{font-size:12.5px;color:var(--ink-soft);text-align:center;margin-top:-8px;margin-bottom:16px;font-style:italic;}

.callout{
  border-radius:14px;padding:16px 18px;margin:16px 0;font-size:14.5px;line-height:1.55;
  display:flex;gap:12px;align-items:flex-start;
}
.callout .ic{font-size:20px;line-height:1;flex-shrink:0;}
.callout.warn{background:#fdf0e9;border:1px solid #f4d3bc;color:#7a3c1e;}
.callout.danger{background:#fbe9e7;border:1px solid #f1bcb5;color:#8a2a1f;}
.callout.tip{background:var(--green-light);border:1px solid #cfe8c9;color:#265426;}
.callout b{font-weight:800;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:14px 0;}
@media(max-width:640px){.grid-2,.grid-3{grid-template-columns:1fr;}}

.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
.chip{background:var(--cream-deep);border:1px solid #e6dcc4;color:var(--brown-dark);font-size:13px;font-weight:700;padding:7px 13px;border-radius:20px;}

.color-card{border-radius:14px;padding:14px;text-align:center;color:#fff;font-weight:800;font-family:var(--font-display);font-size:14px;box-shadow:var(--shadow-sm);}
.color-card .sub{display:block;font-family:var(--font-body);font-weight:700;font-size:12px;margin-top:4px;opacity:.92;}

.epi-card{background:var(--cream-deep);border-radius:14px;padding:12px;text-align:center;}
.epi-card img{border-radius:10px;margin:0 auto 8px;height:120px;object-fit:contain;width:100%;background:#fff;padding:6px;}
.epi-card .name{font-weight:800;font-size:13px;color:var(--brown-dark);}

.timeline{border-left:3px solid var(--green);margin:16px 0 16px 6px;padding-left:20px;}
.timeline .step{margin-bottom:16px;position:relative;}
.timeline .step::before{content:"";position:absolute;left:-26.5px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--green);border:2px solid #fff;box-shadow:0 0 0 2px var(--green);}
.timeline .step b{display:block;font-family:var(--font-display);font-size:14.5px;color:var(--brown-dark);}
.timeline .step span{font-size:13.5px;color:var(--ink-soft);}

table.data-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13.5px;}
table.data-table th{background:var(--brown);color:#fff;text-align:left;padding:9px 12px;font-family:var(--font-display);font-weight:600;font-size:13px;}
table.data-table td{padding:9px 12px;border-bottom:1px solid #eee2cc;color:#42392f;}
table.data-table tr:last-child td{border-bottom:none;}

/* ---------- Checkpoint / knowledge check ---------- */
.check-card{
  background:linear-gradient(135deg,#fff,#fdf5d0);
  border:2px dashed #d8c9a5;border-radius:var(--radius);padding:24px 26px;margin:22px 0;
}
.check-card .kicker{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--orange-dark);margin-bottom:6px;}
.quiz-q{margin-bottom:18px;}
.quiz-q .qtext{font-family:var(--font-display);font-size:16px;color:var(--brown-dark);margin-bottom:10px;}
.quiz-opts{display:flex;flex-direction:column;gap:8px;}
.quiz-opt{
  border:2px solid #e6dcc4;background:#fff;border-radius:12px;padding:11px 14px;font-size:14.5px;font-weight:700;
  text-align:left;transition:all .15s ease;color:#42392f;
}
.quiz-opt:hover{border-color:var(--green);}
.quiz-opt.selected{border-color:var(--green);background:var(--green-light);}
.quiz-opt.correct{border-color:var(--green);background:#defade;color:#1c5a1c;}
.quiz-opt.incorrect{border-color:var(--red);background:#fbe4e1;color:#8a2a1f;}
.quiz-opt:disabled{cursor:default;}
.quiz-feedback{font-size:13.5px;margin-top:8px;padding:10px 12px;border-radius:10px;display:none;}
.quiz-feedback.show{display:block;}
.quiz-feedback.ok{background:var(--green-light);color:#265426;}
.quiz-feedback.bad{background:#fbe9e7;color:#8a2a1f;}

/* ---------- Activity widgets ---------- */
.activity-card{background:#fff8ec;border-radius:var(--radius);padding:26px 28px;margin:22px 0;border:1px solid #f0dfba;}
.activity-card .kicker{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--green-dark);margin-bottom:6px;}
.activity-card h2{font-family:var(--font-display);font-size:19px;color:var(--brown-dark);margin:0 0 10px;}

.classify-board{display:flex;flex-direction:column;gap:22px;margin-top:18px;}
.classify-item{display:flex;gap:16px;align-items:center;background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow-sm);flex-wrap:wrap;}
.classify-item img{width:96px;height:96px;object-fit:cover;border-radius:10px;flex-shrink:0;}
.classify-item .desc{flex:1;min-width:160px;font-size:14px;color:#42392f;font-weight:600;}
.classify-btns{display:flex;gap:6px;flex-wrap:wrap;}
.classify-btn{border:2px solid #e6dcc4;background:#fff;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:800;color:#42392f;}
.classify-btn.pick-fisica.active{background:#e69930;border-color:#e69930;color:#fff;}
.classify-btn.pick-quimica.active{background:#993198;border-color:#993198;color:#fff;}
.classify-btn.pick-biologica.active{background:#c0392b;border-color:#c0392b;color:#fff;}
.classify-btn.pick-correta.active{background:#1fb584;border-color:#1fb584;color:#fff;}
.classify-item.answered{opacity:.75;}
.classify-result{font-size:12.5px;font-weight:800;margin-top:6px;}
.classify-result.ok{color:var(--green-dark);}
.classify-result.bad{color:var(--red);}

.checklist{display:flex;flex-direction:column;gap:10px;margin-top:16px;}
.checklist-item{display:flex;align-items:flex-start;gap:12px;background:#fff;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow-sm);cursor:pointer;}
.checklist-item input{width:20px;height:20px;margin-top:1px;accent-color:var(--green);flex-shrink:0;}
.checklist-item span{font-size:14.5px;font-weight:700;color:#42392f;}
.checklist-item.checked span{color:var(--green-dark);text-decoration:line-through;text-decoration-color:#b8dcb2;}

.scenario{background:#fff;border-radius:14px;padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
.scenario .num{font-family:var(--font-display);font-weight:800;color:var(--orange-dark);font-size:13px;margin-bottom:4px;}
.scenario p.txt{font-size:14.5px;color:#42392f;margin-bottom:10px;}
.scenario-opts{display:flex;gap:8px;flex-wrap:wrap;}
.scenario-opts button{border:2px solid #e6dcc4;background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:800;color:#42392f;}
.scenario-fb{font-size:13.5px;margin-top:10px;padding:10px 12px;border-radius:10px;display:none;line-height:1.5;}
.scenario-fb.show{display:block;}

.errorspot-text{font-size:15px;line-height:2.1;color:#42392f;background:#fff;border-radius:14px;padding:18px 20px;box-shadow:var(--shadow-sm);}
.errspan{background:#fdeee3;border-bottom:2px dotted var(--orange-dark);cursor:pointer;padding:1px 3px;border-radius:4px;}
.errspan.found{background:#defade;border-bottom-color:var(--green-dark);}
.errorspot-tally{margin-top:14px;font-weight:800;color:var(--brown-dark);font-size:14px;}
.errorspot-explain{display:none;background:#fff;border-radius:10px;padding:10px 12px;margin-top:6px;font-size:13px;color:#42392f;border-left:4px solid var(--green);}
.errorspot-explain.show{display:block;}

/* video placeholder */
.video-slot{
  background:#20140c;border-radius:16px;aspect-ratio:16/9;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#d9c6ac;margin:16px 0;position:relative;overflow:hidden;
}
.video-slot .play{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px;}
.video-slot .lbl{font-size:13px;font-weight:700;text-align:center;padding:0 20px;}
.video-slot iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.video-slot.vertical{aspect-ratio:9/16;max-width:280px;margin-left:auto;margin-right:auto;}

/* nav buttons */
.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px;}
.btn{
  border:none;border-radius:14px;padding:13px 22px;font-weight:800;font-size:14.5px;
  display:inline-flex;align-items:center;gap:8px;transition:transform .12s ease, box-shadow .12s ease;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 6px 16px rgba(63,139,63,0.35);}
.btn-primary:hover{background:var(--green-dark);}
.btn-ghost{background:transparent;color:var(--ink-soft);border:2px solid #e6dcc4;}
.btn-ghost:hover{border-color:var(--brown);color:var(--brown-dark);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.section-progress{display:flex;gap:5px;margin-bottom:18px;}
.section-progress > div{height:5px;flex:1;border-radius:4px;background:#eee2cc;}
.section-progress > div.on{background:var(--green);}

/* completion screen */
.complete-hero{
  text-align:center;background:linear-gradient(135deg,var(--brown),var(--brown-dark));color:#fff;
  border-radius:var(--radius);padding:50px 30px;box-shadow:var(--shadow);
}
.complete-hero .mascot-complete{width:140px;height:auto;margin:0 auto 18px;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.35));}
.complete-hero h1{font-family:var(--font-display);font-size:28px;margin:0 0 10px;}
.complete-hero p{font-size:15px;color:#e8dcc8;max-width:480px;margin:0 auto 26px;line-height:1.6;}
.complete-hero .btn-primary{background:var(--green);}

::-webkit-scrollbar{width:9px;}
::-webkit-scrollbar-thumb{background:#d8c9a5;border-radius:6px;}

@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .25s ease;z-index:40;box-shadow:0 0 40px rgba(0,0,0,0.3);}
  .sidebar.open{transform:translateX(0);}
  .mobile-menu-btn{display:flex;align-items:center;gap:8px;background:var(--brown);color:#fff;border:none;border-radius:10px;padding:9px 14px;font-weight:800;font-size:13px;}
  .main{padding:0 16px 60px;}
  .module-hero{padding:24px 20px;}
  .lesson-card{padding:20px;}
  .overlay-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30;}
  .overlay-bg.show{display:block;}
}
</style>
</head>
<body>
<div id="app">
  <div class="overlay-bg" id="overlayBg"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="mark"><img src="" data-img="mascote-burger-cap" alt="Mascote Cabana Burger"></div>
      <div class="txt">Universidade Cabana<span>Curso de Qualidade</span></div>
    </div>
    <div class="sidebar-title">Boas Práticas &amp; Segurança Alimentar</div>
    <div class="sidebar-sub">Do recebimento à mesa do cliente: os padrões que protegem quem come e quem cozinha.</div>
    <div class="progress-overview">
      <div class="pct" id="progressPct">0%</div>
      <div class="bar"><div id="progressBarFill" style="width:0%"></div></div>
      <div class="lbl" id="progressLbl">0 de 6 módulos concluídos</div>
    </div>
    <ul class="nav-modules" id="navModules"></ul>
    <div class="sidebar-footer">Cabana Burger · Treinamento &amp; Desenvolvimento</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="mobile-menu-btn" id="menuBtn">☰ Módulos</button>
      <div class="crumb" id="crumbLbl"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

/* ---------------- state ---------------- */
const state = {
  currentModuleIdx: 0,
  showingComplete: false,
  moduleState: COURSE.modules.map(()=>({activityDone:false, quizAnswered:[], quizCorrect:[]})),
  completedModules: new Set()
};

const FORM_URL = "https://forms.cloud.microsoft/r/eKiUhENK3w";

function imgSrc(key){ return IMG[key] || ''; }
function hydrateImages(root){
  root.querySelectorAll('img[data-img]').forEach(img=>{
    img.src = imgSrc(img.getAttribute('data-img'));
  });
}

function initModuleState(){
  COURSE.modules.forEach((m,i)=>{
    const s = state.moduleState[i];
    s.quizAnswered = m.quiz.map(()=>false);
    s.quizCorrect = m.quiz.map(()=>false);
  });
}
initModuleState();

/* ---------------- sidebar ---------------- */
function renderSidebar(){
  const nav = document.getElementById('navModules');
  nav.innerHTML = '';
  COURSE.modules.forEach((m,i)=>{
    const li = document.createElement('li');
    li.className = 'nav-module' + (i===state.currentModuleIdx && !state.showingComplete ? ' active':'') + (state.completedModules.has(i) ? ' done':'');
    li.innerHTML = `<div class="num">${m.num}</div><div><div class="label">${m.label}</div><div class="sub">${m.sub}</div></div>`;
    li.addEventListener('click', ()=>{ goToModule(i); closeMobileSidebar(); });
    nav.appendChild(li);
  });
  const total = COURSE.modules.length;
  const done = state.completedModules.size;
  const pct = Math.round((done/total)*100);
  document.getElementById('progressPct').textContent = pct+'%';
  document.getElementById('progressBarFill').style.width = pct+'%';
  document.getElementById('progressLbl').textContent = `${done} de ${total} módulos concluídos`;
}

function closeMobileSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlayBg').classList.remove('show');
}

document.getElementById('menuBtn').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlayBg').classList.add('show');
});
document.getElementById('overlayBg').addEventListener('click', closeMobileSidebar);

/* ---------------- module render ---------------- */
function goToModule(i){
  state.currentModuleIdx = i;
  state.showingComplete = false;
  renderAll();
  window.scrollTo({top:0, behavior:'instant'});
}

function renderAll(){
  renderSidebar();
  if(state.showingComplete){ renderComplete(); return; }
  const m = COURSE.modules[state.currentModuleIdx];
  document.getElementById('crumbLbl').innerHTML = `Módulo ${m.num} de ${COURSE.modules.length} &middot; <b>${m.label}</b>`;
  const c = document.getElementById('content');
  c.innerHTML = '';

  // hero
  const hero = document.createElement('div');
  hero.className = 'module-hero';
  hero.innerHTML = `<div class="eyebrow">${m.hero.eyebrow}</div><h1>${m.hero.title}</h1><p>${m.hero.text}</p>`;
  c.appendChild(hero);

  // sections
  m.sections.forEach(sec=>{
    const card = document.createElement('div');
    card.className = 'lesson-card';
    let inner = `<h2>${sec.h}</h2>${sec.body}`;
    card.innerHTML = inner;
    // fix inline images that use data-img
    card.querySelectorAll('img[data-img]').forEach(img=>{
      img.src = imgSrc(img.getAttribute('data-img'));
    });
    c.appendChild(card);
    if(sec.video){
      const v = document.createElement('div');
      v.className = 'lesson-card';
      v.innerHTML = renderVideoSlot(sec.video, sec.videoCaption, sec.videoVertical);
      c.appendChild(v);
    }
  });

  // activity
  if(m.activity){
    c.appendChild(renderActivity(m, state.currentModuleIdx));
  } else {
    state.moduleState[state.currentModuleIdx].activityDone = true;
  }

  // quiz
  c.appendChild(renderQuiz(m, state.currentModuleIdx));

  // nav buttons
  const nav = document.createElement('div');
  nav.className = 'lesson-nav';
  const isLast = state.currentModuleIdx === COURSE.modules.length-1;
  nav.innerHTML = `
    <button class="btn btn-ghost" id="prevBtn" ${state.currentModuleIdx===0 ? 'disabled':''}>← Módulo anterior</button>
    <button class="btn btn-primary" id="nextBtn" disabled>${isLast ? 'Concluir curso' : 'Concluir módulo e continuar'} →</button>
  `;
  c.appendChild(nav);

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(state.currentModuleIdx>0) goToModule(state.currentModuleIdx-1);
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    state.completedModules.add(state.currentModuleIdx);
    if(isLast){
      state.showingComplete = true;
      renderAll();
      window.scrollTo({top:0, behavior:'instant'});
    } else {
      goToModule(state.currentModuleIdx+1);
    }
  });

  updateNextButton();
}

function renderVideoSlot(videoId, caption, vertical){
  const cls = vertical ? 'video-slot vertical' : 'video-slot';
  const cap = caption ? `<p style="font-size:13px;color:var(--ink-soft);margin-top:8px;text-align:center;">${caption}</p>` : '';
  if(videoId){
    return `<div class="${cls}"><iframe src="https://www.youtube-nocookie.com/embed/${videoId}" title="Vídeo" allowfullscreen></iframe></div>${cap}`;
  }
  return `<div class="${cls}"><div class="play">▶</div><div class="lbl">Espaço reservado para o vídeo<br>(o link do YouTube será inserido aqui)</div></div>${cap}`;
}

/* ---------------- activity rendering ---------------- */
function renderActivity(m, mi){
  const wrap = document.createElement('div');
  wrap.className = 'activity-card';
  const a = m.activity;

  if(a.type==='classify'){
    wrap.innerHTML = `<div class="kicker">Atividade prática</div><h2>${a.title}</h2><p style="font-size:14.5px;color:#42392f;">${a.intro}</p>
      <div class="classify-board" id="classifyBoard-${mi}"></div>`;
    const board = wrap.querySelector(`#classifyBoard-${mi}`);
    a.items.forEach((item, idx)=>{
      const row = document.createElement('div');
      row.className = 'classify-item';
      row.id = `citem-${mi}-${idx}`;
      row.innerHTML = `<img src="${imgSrc(item.img)}" alt="">
        <div class="desc">${item.desc}<div class="classify-result" id="cres-${mi}-${idx}"></div></div>
        <div class="classify-btns">${a.options.map(o=>`<button class="classify-btn ${o.cls}" data-key="${o.key}" data-mi="${mi}" data-idx="${idx}">${o.label}</button>`).join('')}</div>`;
      board.appendChild(row);
    });
    wrap.querySelectorAll('.classify-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const mi2 = +btn.dataset.mi, idx = +btn.dataset.idx, key = btn.dataset.key;
        const item = COURSE.modules[mi2].activity.items[idx];
        const row = document.getElementById(`citem-${mi2}-${idx}`);
        if(row.classList.contains('answered')) return;
        row.querySelectorAll('.classify-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        row.classList.add('answered');
        const res = document.getElementById(`cres-${mi2}-${idx}`);
        if(key===item.correct){
          res.className='classify-result ok'; res.textContent = '✓ Correto! '+item.explain;
        } else {
          res.className='classify-result bad'; res.textContent = '✗ Não é bem isso. '+item.explain;
        }
        checkActivityDone(mi2);
      });
    });
  }

  else if(a.type==='checklist'){
    wrap.innerHTML = `<div class="kicker">Autoavaliação</div><h2>${a.title}</h2><p style="font-size:14.5px;color:#42392f;">${a.intro}</p>
      <div class="checklist" id="checklist-${mi}"></div>`;
    const box = wrap.querySelector(`#checklist-${mi}`);
    a.items.forEach((txt, idx)=>{
      const row = document.createElement('label');
      row.className='checklist-item';
      row.innerHTML = `<input type="checkbox" data-mi="${mi}" data-idx="${idx}"><span>${txt}</span>`;
      box.appendChild(row);
    });
    wrap.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change', (e)=>{
        e.target.closest('.checklist-item').classList.toggle('checked', e.target.checked);
        const mi2 = +cb.dataset.mi;
        const all = wrap.querySelectorAll('input[type=checkbox]');
        const allChecked = Array.from(all).every(x=>x.checked);
        if(allChecked) checkActivityDone(mi2, true);
      });
    });
  }

  else if(a.type==='scenario'){
    const imgHtml = a.image ? `<img class="inline-img" src="${imgSrc(a.image)}" alt="" style="margin-bottom:6px;">` : '';
    wrap.innerHTML = `<div class="kicker">Simulação prática</div><h2>${a.title}</h2>${imgHtml}<p style="font-size:14.5px;color:#42392f;">${a.intro}</p>
      <div id="scenarios-${mi}"></div>`;
    const box = wrap.querySelector(`#scenarios-${mi}`);
    a.items.forEach((sc, idx)=>{
      const card = document.createElement('div');
      card.className='scenario';
      card.id=`sc-${mi}-${idx}`;
      card.innerHTML = `<div class="num">${sc.num}</div><p class="txt">${sc.txt}</p>
        <div class="scenario-opts">${sc.opts.map((o,oi)=>`<button data-mi="${mi}" data-idx="${idx}" data-oi="${oi}">${o}</button>`).join('')}</div>
        <div class="scenario-fb" id="scfb-${mi}-${idx}"></div>`;
      box.appendChild(card);
    });
    wrap.querySelectorAll('.scenario-opts button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const mi2=+btn.dataset.mi, idx=+btn.dataset.idx, oi=+btn.dataset.oi;
        const card = document.getElementById(`sc-${mi2}-${idx}`);
        if(card.dataset.answered) return;
        card.dataset.answered='1';
        const sc = COURSE.modules[mi2].activity.items[idx];
        const fb = document.getElementById(`scfb-${mi2}-${idx}`);
        card.querySelectorAll('.scenario-opts button').forEach((b,bi)=>{
          b.disabled = true;
          if(bi===sc.correct) b.style.cssText='border-color:#53a246;background:#deedd5;color:#1c5a1c;';
          else if(bi===oi) b.style.cssText='border-color:#c0392b;background:#fbe4e1;color:#8a2a1f;';
        });
        fb.className='scenario-fb show';
        fb.style.background = oi===sc.correct ? '#deedd5' : '#fbe9e7';
        fb.style.color = oi===sc.correct ? '#265426' : '#8a2a1f';
        fb.textContent = (oi===sc.correct ? '✓ Isso mesmo. ' : '✗ Quase. ') + sc.explain;
        checkScenariosDone(mi2);
      });
    });
  }

  else if(a.type==='errorspot'){
    wrap.innerHTML = `<div class="kicker">Encontre o erro</div><h2>${a.title}</h2><p style="font-size:14.5px;color:#42392f;">${a.intro}</p>
      <div class="errorspot-text" id="errtext-${mi}"></div>
      <div class="errorspot-tally" id="errtally-${mi}">0 de ${a.text.filter(t=>t.err).length} erros encontrados</div>`;
    const box = wrap.querySelector(`#errtext-${mi}`);
    a.text.forEach((seg, idx)=>{
      if(seg.err){
        const span = document.createElement('span');
        span.className='errspan';
        span.id = `errsp-${mi}-${idx}`;
        span.textContent = seg.t;
        span.addEventListener('click', ()=>{
          if(span.classList.contains('found')) return;
          span.classList.add('found');
          const ex = document.getElementById(`errex-${mi}-${idx}`);
          ex.classList.add('show');
          updateErrTally(mi);
        });
        box.appendChild(span);
        const explainDiv = document.createElement('div');
        explainDiv.className='errorspot-explain';
        explainDiv.id=`errex-${mi}-${idx}`;
        explainDiv.textContent = '💡 '+seg.explain;
        // store explain node right after in a wrapper - append after text flows; simplest: put in a list below
        box.appendChild(explainDiv);
      } else {
        box.appendChild(document.createTextNode(seg.t));
      }
    });
  }

  return wrap;
}

function checkActivityDone(mi, force){
  const m = COURSE.modules[mi];
  if(m.activity.type==='classify'){
    const total = m.activity.items.length;
    const answered = document.querySelectorAll(`#classifyBoard-${mi} .classify-item.answered`).length;
    if(answered>=total) state.moduleState[mi].activityDone = true;
  } else if(force){
    state.moduleState[mi].activityDone = true;
  }
  updateNextButton();
}
function checkScenariosDone(mi){
  const m = COURSE.modules[mi];
  const total = m.activity.items.length;
  const answered = document.querySelectorAll(`#scenarios-${mi} .scenario[data-answered]`).length;
  if(answered>=total) state.moduleState[mi].activityDone = true;
  updateNextButton();
}
function updateErrTally(mi){
  const m = COURSE.modules[mi];
  const total = m.activity.text.filter(t=>t.err).length;
  const found = document.querySelectorAll(`#errtext-${mi} .errspan.found`).length;
  document.getElementById(`errtally-${mi}`).textContent = `${found} de ${total} erros encontrados`;
  if(found>=total) state.moduleState[mi].activityDone = true;
  updateNextButton();
}

/* ---------------- quiz rendering ---------------- */
function renderQuiz(m, mi){
  const wrap = document.createElement('div');
  wrap.className = 'check-card';
  wrap.innerHTML = `<div class="kicker">Checkpoint de conhecimento</div>`;
  const title = document.createElement('h2');
  title.style.cssText='font-family:var(--font-display);font-size:19px;color:var(--brown-dark);margin:0 0 14px;';
  title.textContent = 'Vamos ver se ficou claro?';
  wrap.appendChild(title);

  m.quiz.forEach((q, qi)=>{
    const qd = document.createElement('div');
    qd.className='quiz-q';
    qd.innerHTML = `<div class="qtext">${qi+1}. ${q.q}</div>
      <div class="quiz-opts" id="qopts-${mi}-${qi}"></div>
      <div class="quiz-feedback" id="qfb-${mi}-${qi}"></div>`;
    const opts = qd.querySelector(`#qopts-${mi}-${qi}`);
    q.opts.forEach((otxt, oi)=>{
      const b = document.createElement('button');
      b.className='quiz-opt';
      b.textContent = otxt;
      b.addEventListener('click', ()=>{
        const already = state.moduleState[mi].quizCorrect[qi];
        if(already) return;
        const allBtns = opts.querySelectorAll('.quiz-opt');
        allBtns.forEach(b2=>b2.classList.remove('selected'));
        const fb = document.getElementById(`qfb-${mi}-${qi}`);
        if(oi===q.correct){
          b.classList.add('correct');
          allBtns.forEach(b2=>b2.disabled=true);
          fb.className='quiz-feedback show ok';
          fb.textContent = '✓ '+q.explain;
          state.moduleState[mi].quizCorrect[qi] = true;
          updateNextButton();
        } else {
          b.classList.add('incorrect');
          fb.className='quiz-feedback show bad';
          fb.textContent = 'Não é essa. Tente novamente.';
          setTimeout(()=>{ b.classList.remove('incorrect'); }, 900);
        }
      });
      opts.appendChild(b);
    });
    wrap.appendChild(qd);
  });
  return wrap;
}

function updateNextButton(){
  const mi = state.currentModuleIdx;
  const s = state.moduleState[mi];
  const quizOk = s.quizCorrect.every(Boolean);
  const btn = document.getElementById('nextBtn');
  if(!btn) return;
  btn.disabled = !(s.activityDone && quizOk);
}

/* ---------------- completion screen ---------------- */
function renderComplete(){
  document.getElementById('crumbLbl').innerHTML = 'Curso concluído';
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="complete-hero">
      <img class="mascot-complete" src="" data-img="mascote-burger-cap" alt="Mascote Cabana Burger comemorando">
      <h1>Parabéns, você concluiu o curso!</h1>
      <p>Você passou pelos 6 módulos de Qualidade e Segurança Alimentar do Cabana Burger. Agora é colocar cada detalhe em prática todos os dias — é isso que protege nossos clientes e o nosso padrão.</p>
      <a class="btn btn-primary" href="${FORM_URL}" target="_blank" rel="noopener">Registrar minha conclusão →</a>
    </div>
    <div class="lesson-card" style="margin-top:22px;">
      <h2>Revisitar um módulo</h2>
      <p>Quer rever algum conteúdo? Escolha um módulo na barra lateral a qualquer momento.</p>
    </div>
  `;
  hydrateImages(c);
}

/* ---------------- boot ---------------- */
hydrateImages(document.querySelector('.sidebar-logo'));
renderAll();

</script>
